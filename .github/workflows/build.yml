
name: Build NovaTone

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine-test:
    name: Engine-Test (ohne JUCE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./Tests/run_tests.sh

  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G "Visual Studio 18 2026" -A x64
      - run: cmake --build build --config Release --target NovaTone_VST3 NovaTone_Standalone --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTone-Windows
          path: |
            build/NovaTone_artefacts/Release/VST3/NovaTone.vst3
            build/NovaTone_artefacts/Release/Standalone/NovaTone.exe

  macos:
    name: macOS Universal (VST3 + Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G Xcode
      - run: cmake --build build --config Release --target NovaTone_VST3 NovaTone_Standalone --parallel
      - run: |
          cd build/NovaTone_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/NovaTone-macOS.zip" VST3/NovaTone.vst3 Standalone/NovaTone.app
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTone-macOS
          path: NovaTone-macOS.zip
